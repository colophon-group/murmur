name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          else
            echo "pm=none" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.pm.outputs.pm == 'pnpm'

      - uses: actions/setup-node@v4
        if: steps.pm.outputs.pm != 'none'
        with:
          node-version-file: .nvmrc
          cache: ${{ steps.pm.outputs.pm }}

      - name: Install
        if: steps.pm.outputs.pm == 'pnpm'
        run: pnpm install --frozen-lockfile

      - name: Install (npm)
        if: steps.pm.outputs.pm == 'npm'
        run: npm ci

      - name: Typecheck
        if: steps.pm.outputs.pm != 'none'
        run: ${{ steps.pm.outputs.pm }} run typecheck

      - name: Lint
        if: steps.pm.outputs.pm != 'none'
        run: ${{ steps.pm.outputs.pm }} run lint

      - name: Test
        if: steps.pm.outputs.pm != 'none'
        run: ${{ steps.pm.outputs.pm }} run test

      - name: Grep gates
        run: bash scripts/grep-all.sh

      - name: Coverage report
        if: steps.pm.outputs.pm != 'none' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Least-privilege workflow perms: the build job needs to push images to
    # GHCR, nothing else. Kept as belt-and-suspenders even though the actual
    # auth flows through the credential below.
    permissions:
      contents: read
      packages: write
    concurrency:
      group: build-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Buildx for ARM64
        uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        # Direct docker login bypasses docker/login-action@v3's auth probe,
        # which fails our classic-PAT setup with `denied: denied` even though
        # the registry's standard token-exchange flow works (verified via
        # /token?service=ghcr.io). Stdin keeps the PAT off argv. The
        # downstream docker/build-push-action@v5 reads credentials from
        # ~/.docker/config.json written here.
        # Username is the PAT owner's GitHub login (viktor-shcherb), NOT the
        # org name. The package lives under colophon-group/ but the docker
        # login presents the user's identity; the registry then checks that
        # user's perms against the org package on subsequent push.
        run: echo "$GHCR_PAT" | docker login ghcr.io -u viktor-shcherb --password-stdin
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          OWNER: ${{ github.repository_owner }}
      - name: Build & push
        if: hashFiles('Dockerfile') != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
