name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "pm=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            echo "pm=npm" >> "$GITHUB_OUTPUT"
          else
            echo "pm=none" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.pm.outputs.pm == 'pnpm'

      - uses: actions/setup-node@v4
        if: steps.pm.outputs.pm != 'none'
        with:
          node-version-file: .nvmrc
          cache: ${{ steps.pm.outputs.pm }}

      - name: Install
        if: steps.pm.outputs.pm == 'pnpm'
        run: pnpm install --frozen-lockfile

      - name: Install (npm)
        if: steps.pm.outputs.pm == 'npm'
        run: npm ci

      - name: Typecheck
        if: steps.pm.outputs.pm != 'none'
        run: ${{ steps.pm.outputs.pm }} run typecheck

      - name: Lint
        if: steps.pm.outputs.pm != 'none'
        run: ${{ steps.pm.outputs.pm }} run lint

      - name: Test
        if: steps.pm.outputs.pm != 'none'
        run: ${{ steps.pm.outputs.pm }} run test

      - name: Grep gates
        run: bash scripts/grep-all.sh

      - name: Coverage report
        if: steps.pm.outputs.pm != 'none' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Least-privilege workflow perms: the build job needs to push images to
    # GHCR, nothing else. Kept as belt-and-suspenders even though the actual
    # auth flows through the credential below.
    permissions:
      contents: read
      packages: write
    concurrency:
      group: build-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Buildx for ARM64
        uses: docker/setup-buildx-action@v3
      - name: Debug PAT delivery
        # Verify the secret reaches the runner intact. Prints length + prefix
        # only (first 4 chars are the well-known `ghp_` prefix; not a leak).
        # Then tries the GHCR token-exchange flow that works from the orchestrator's
        # local probe — if this fails too, the secret is malformed in transit.
        run: |
          echo "PAT length: ${#GHCR_PAT}"
          echo "PAT prefix (first 4): ${GHCR_PAT:0:4}"
          echo "PAT suffix (last 4): ${GHCR_PAT: -4}"
          HTTP=$(curl -s -o /tmp/r.json -w "%{http_code}" -u "viktor-shcherb:${GHCR_PAT}" "https://ghcr.io/token?service=ghcr.io&scope=repository:colophon-group/murmur:push,pull")
          echo "GHCR /token HTTP: $HTTP"
          python3 -c "import json,sys; d=json.load(open('/tmp/r.json')); print('keys:', list(d.keys())); print('errors:', d.get('errors')); print('token len:', len(d.get('token','')) if isinstance(d.get('token'), str) else 'no-token')"
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
      - name: Login GHCR
        run: echo "$GHCR_PAT" | docker login ghcr.io -u viktor-shcherb --password-stdin
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
      - name: Build & push
        if: hashFiles('Dockerfile') != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
